# The Ubuntu pools are NTS only. chrony's default authselectmode, mix, turns
# authenticated sources into required ones as soon as an unauthenticated source
# is configured as well, which is what the DHCP provided server written to
# /run/chrony-dhcp is. On a network that cannot reach the pools, because NTS
# needs 4460/tcp on top of 123/udp, that leaves the board permanently
# unsynchronised while chronyc shows the reachable local server excluded from
# selection ("no required source in selectable sources").
#
# Taking authentication out of the selection keeps the local server usable. The
# pools are still listed with the prefer option, and a preferred source
# excludes the others whenever it is selectable, so the pools continue to win
# wherever they can be reached and the local server is only a fallback.
#
# Drop this file to get the upstream behaviour back.
authselectmode ignore
