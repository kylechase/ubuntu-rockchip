name: Nightly Build
run-name: Nightly build
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:

  config:
    runs-on: ubuntu-24.04
    name: Create martrix
    outputs:
      build_matrix: ${{ steps.build.outputs.build_matrix }}
      rootfs_matrix: ${{ steps.rootfs.outputs.rootfs_matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create build matrix
        id: build
        run: |
            build_matrix=""
            for file in config/boards/*; do
                COMPATIBLE_SUITES=()
                COMPATIBLE_FLAVORS=()
                # shellcheck disable=SC1090
                source "${file}"
                board="$(basename "${file%.sh}")"
                for suite in "${COMPATIBLE_SUITES[@]}"; do
                    SUITE_FLAVORS=()
                    BUILD_RUNNER=""
                    KERNEL_SOURCE=""
                    # shellcheck disable=SC1090
                    source "config/suites/${suite}.sh"
                    # Suites built against the Ubuntu archive have no ppa packages
                    flags="--launchpad"
                    if [ "${KERNEL_SOURCE}" == "archive" ]; then
                        flags=""
                    fi
                    for flavor in "${COMPATIBLE_FLAVORS[@]}"; do
                        if [ -n "${SUITE_FLAVORS[*]}" ] && [[ ! " ${SUITE_FLAVORS[*]} " =~ [[:space:]]${flavor}[[:space:]] ]]; then
                            continue
                        fi
                        build_matrix+="{\"board\":\"${board}\",\"suite\":\"${suite}\",\"flavor\":\"${flavor}\",\"runner\":\"${BUILD_RUNNER:-ubuntu-24.04}\",\"flags\":\"${flags}\"},"
                    done
                done
            done
            echo "build_matrix={\"include\":[${build_matrix::-1}]}" >> $GITHUB_OUTPUT

      - name: Create rootfs matrix
        id: rootfs
        run: |
            rootfs_matrix=""
            for file in config/suites/*; do
                SUITE_FLAVORS=()
                BUILD_RUNNER=""
                KERNEL_SOURCE=""
                # shellcheck disable=SC1090
                source "${file}"
                suite="$(basename "${file%.sh}")"
                flags="--launchpad"
                if [ "${KERNEL_SOURCE}" == "archive" ]; then
                    flags=""
                fi
                for flavor in config/flavors/*; do
                    flavor="$(basename "${flavor%.sh}")"
                    if [ -n "${SUITE_FLAVORS[*]}" ] && [[ ! " ${SUITE_FLAVORS[*]} " =~ [[:space:]]${flavor}[[:space:]] ]]; then
                        continue
                    fi
                    rootfs_matrix+="{\"suite\":\"${suite}\",\"flavor\":\"${flavor}\",\"runner\":\"${BUILD_RUNNER:-ubuntu-24.04}\",\"flags\":\"${flags}\"},"
                done
            done
            echo "rootfs_matrix={\"include\":[${rootfs_matrix::-1}]}" >> $GITHUB_OUTPUT

  rootfs:
    runs-on: ${{ matrix.runner }}
    name: Build rootfs 
    needs: [config]
    strategy:
        matrix: ${{ fromJson(needs.config.outputs.rootfs_matrix) }}
    steps:
      - name: Get more disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        id: vars
        run: |
          source config/suites/${{ matrix.suite }}.sh
          echo "suite_version=$RELASE_VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu bison \
          flex libssl-dev bc rsync kmod cpio xz-utils fakeroot parted udev \
          dosfstools uuid-runtime device-tree-compiler python3 python-is-python3 \
          python3-pyelftools python3-setuptools fdisk debhelper dpkg-dev swig \
          libfdt-dev libpython3-dev dctrl-tools u-boot-tools debootstrap \
          distro-info mtools gdisk zstd qemu-user

      - name: Register binfmt handlers for arm64
        shell: bash
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Build
        shell: bash
        run: sudo ./build.sh --suite=${{ matrix.suite }} --flavor=${{ matrix.flavor }} --rootfs-only ${{ matrix.flags }}

      - name: Upload
        uses: actions/upload-artifact@v4.3.3
        with:
            name: ubuntu-${{ steps.vars.outputs.suite_version }}-preinstalled-${{ matrix.flavor }}-arm64-rootfs
            path: ./build/ubuntu-${{ steps.vars.outputs.suite_version }}-preinstalled-${{ matrix.flavor }}-arm64.rootfs.tar.xz
            if-no-files-found: error

  build:
    runs-on: ${{ matrix.runner }}
    needs: [rootfs, config]
    name: Build image 
    strategy:
        matrix: ${{ fromJson(needs.config.outputs.build_matrix) }}
    steps:
      - name: Get more disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        id: vars
        run: |
          source config/suites/${{ matrix.suite }}.sh
          echo "suite_version=$RELASE_VERSION" >> $GITHUB_OUTPUT

      - name: Checkout rootfs
        uses: actions/download-artifact@v4.1.2
        with:
            name: ubuntu-${{ steps.vars.outputs.suite_version }}-preinstalled-${{ matrix.flavor }}-arm64-rootfs
            path: ./build/

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu bison \
          flex libssl-dev bc rsync kmod cpio xz-utils fakeroot parted udev \
          dosfstools uuid-runtime device-tree-compiler python3 python-is-python3 \
          python3-pyelftools python3-setuptools fdisk debhelper dpkg-dev swig \
          libfdt-dev libpython3-dev dctrl-tools u-boot-tools debootstrap \
          distro-info mtools gdisk zstd qemu-user

      - name: Register binfmt handlers for arm64
        shell: bash
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Build
        shell: bash
        run: sudo ./build.sh --board=${{ matrix.board }} --suite=${{ matrix.suite }} --flavor=${{ matrix.flavor }} ${{ matrix.flags }}

      - name: Upload
        uses: actions/upload-artifact@v4.3.3
        with:
          name: ubuntu-${{ steps.vars.outputs.suite_version }}-preinstalled-${{ matrix.flavor }}-arm64-${{ matrix.board }}
          path: ./images/ubuntu-*-preinstalled-${{ matrix.flavor }}-arm64-${{ matrix.board }}.*
          if-no-files-found: error

      - name: Clean cache
        shell: bash
        run: sync && sudo rm -rf ./images/ ./build/ && sync
